name: Test and publish Narrative Radar
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: narrative-radar-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify scoring, historical alignment, persistence and API
        run: python -m unittest discover -s tests -v
      - uses: actions/cache/restore@v4
        with:
          path: .radar/build.db
          key: radar-public-v2-${{ github.run_id }}
          restore-keys: radar-public-v2-
      - name: Build a public snapshot without private research
        env:
          RADAR_REFRESH_PUBLIC: '1'
        run: python -m scripts.build_site
      - name: Validate build files and provenance
        run: python -m scripts.verify_site dist
      - name: Save the public-only evidence history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .radar/build.db
          key: radar-public-v2-${{ github.run_id }}
      - name: Upload data diagnostics for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-data-diagnostics
          path: |
            dist/data/build.json
            dist/data/readiness.json
            dist/data/score-inputs.json
            dist/data/market-audit.json
          if-no-files-found: warn
      - name: Require core evidence and recent market samples
        run: python -m scripts.check_data_readiness dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the public deployment
        env:
          RADAR_PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
        run: python -m scripts.verify_deployment
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-verification
          path: .radar/deployment-verification.json
          if-no-files-found: ignore
